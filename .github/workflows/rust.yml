name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and clippy (Linux and Windows target)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Toolchain
      run: |
        rustup toolchain install stable --profile minimal -c rustfmt,clippy
        rustup target add x86_64-pc-windows-gnu
        sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
    - uses: Swatinem/rust-cache@v2
    - name: Format
      run: cargo fmt --check
    - name: Clippy (Linux)
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Clippy (Windows target)
      run: cargo clippy --all-targets --locked --target x86_64-pc-windows-gnu -- -D warnings
    - name: Rules lint
      run: cargo run --quiet --locked -- rules check

  test-linux:
    name: Unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Test
      run: cargo test --locked

  test-windows:
    name: Unit tests (Windows)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: Swatinem/rust-cache@v2
    - name: Test
      run: cargo test --locked

  package:
    name: Release bundle
    needs: [lint, test-linux, test-windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Toolchain
      run: |
        rustup target add x86_64-pc-windows-gnu
        sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
    - uses: Swatinem/rust-cache@v2
    - name: Build the zip (asa.exe, rules, README, licenses, SHA256SUMS)
      run: scripts/package.sh
    - uses: actions/upload-artifact@v4
      with:
        name: asa-windows-x64
        path: |
          dist/*.zip
          dist/*.zip.sha256
        if-no-files-found: error
